<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Support Ticket Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#f0f2f5;--sidebar-bg:#1e1e2e;--card-bg:#ffffff;
    --text:#1a1a2e;--subtext:#6b7280;--border:#e5e7eb;
    --primary:#2563EB;--primary-light:#eff6ff;
    --success:#10b981;--warning:#f59e0b;--danger:#ef4444;
    --sidebar-text:#a0aec0;--sidebar-active:#ffffff;
  }
  .dark{
    --bg:#0f0f1a;--card-bg:#1e1e2e;--text:#e2e8f0;
    --subtext:#94a3b8;--border:#2d2d3f;--primary-light:#1e3a5f;
    --sidebar-bg:#13131f;
  }
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;transition:all 0.3s;}
  /* SIDEBAR */
  .sidebar{width:240px;background:var(--sidebar-bg);padding:24px 0;display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100;}
  .sidebar-logo{padding:0 20px 24px;font-size:18px;font-weight:700;color:#fff;border-bottom:1px solid #2d2d3f;}
  .sidebar-logo span{color:var(--primary);}
  .sidebar-menu{padding:16px 0;flex:1;}
  .sidebar-item{display:flex;align-items:center;gap:10px;padding:12px 20px;color:var(--sidebar-text);cursor:pointer;transition:all 0.2s;font-size:14px;font-weight:500;}
  .sidebar-item:hover,.sidebar-item.active{background:#2d2d3f;color:var(--sidebar-active);}
  .sidebar-item.active{border-left:3px solid var(--primary);}
  .sidebar-icon{font-size:18px;}
  /* MAIN */
  .main{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
  /* NAVBAR */
  .navbar{background:var(--card-bg);border-bottom:1px solid var(--border);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99;}
  .navbar-title{font-size:18px;font-weight:600;}
  .navbar-right{display:flex;align-items:center;gap:16px;}
  .btn-icon{background:none;border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer;font-size:16px;color:var(--text);transition:all 0.2s;}
  .btn-icon:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
  /* CONTENT */
  .content{padding:24px;flex:1;}
  /* STATS */
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
  .stat-card{background:var(--card-bg);border-radius:12px;padding:20px;border:1px solid var(--border);display:flex;align-items:center;gap:16px;}
  .stat-icon{font-size:28px;}
  .stat-value{font-size:28px;font-weight:700;}
  .stat-label{font-size:13px;color:var(--subtext);}
  /* TOOLBAR */
  .toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .search-box{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text);font-size:14px;outline:none;}
  .search-box:focus{border-color:var(--primary);}
  select.filter{padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text);font-size:14px;cursor:pointer;outline:none;}
  .btn{padding:10px 16px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:500;transition:all 0.2s;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{opacity:0.9;}
  .btn-outline{background:none;border:1px solid var(--border);color:var(--text);}
  .btn-outline:hover{border-color:var(--primary);color:var(--primary);}
  /* TICKETS GRID */
  .tickets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}
  .ticket-card{background:var(--card-bg);border-radius:12px;border:1px solid var(--border);padding:20px;transition:all 0.2s;position:relative;}
  .ticket-card:hover{box-shadow:0 4px 20px rgba(0,0,0,0.1);transform:translateY(-2px);}
  .ticket-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
  .ticket-id{font-size:12px;color:var(--subtext);font-weight:600;}
  .badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;}
  .badge-high{background:#fee2e2;color:#dc2626;}
  .badge-medium{background:#fef3c7;color:#d97706;}
  .badge-low{background:#d1fae5;color:#059669;}
  .ticket-title{font-size:15px;font-weight:600;margin-bottom:8px;line-height:1.4;}
  .ticket-desc{font-size:13px;color:var(--subtext);margin-bottom:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .ticket-meta{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
  .ticket-meta-item{font-size:12px;color:var(--subtext);}
  .ticket-meta-item strong{color:var(--text);}
  .ticket-footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .status-select{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-size:12px;cursor:pointer;}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;}
  .btn-danger{background:#fee2e2;color:#dc2626;border:none;}
  .btn-danger:hover{background:#dc2626;color:#fff;}
  .ticket-time{font-size:11px;color:var(--subtext);margin-top:10px;}
  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--card-bg);border-radius:16px;padding:28px;width:90%;max-width:600px;max-height:90vh;overflow-y:auto;}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .modal-title{font-size:18px;font-weight:700;}
  .modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--subtext);}
  .modal-field{margin-bottom:16px;}
  .modal-label{font-size:12px;font-weight:600;color:var(--subtext);text-transform:uppercase;margin-bottom:4px;}
  .modal-value{font-size:14px;color:var(--text);line-height:1.6;}
  .notes-box{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;resize:vertical;min-height:100px;font-family:inherit;}
  .notes-box:focus{outline:none;border-color:var(--primary);}
  /* TOAST */
  .toast{position:fixed;bottom:24px;right:24px;background:#1e1e2e;color:#fff;padding:14px 20px;border-radius:10px;font-size:14px;z-index:9999;display:none;animation:slideIn 0.3s ease;}
  .toast.show{display:block;}
  @keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
  /* EMPTY STATE */
  .empty-state{text-align:center;padding:60px 20px;color:var(--subtext);}
  .empty-icon{font-size:48px;margin-bottom:12px;}
  /* NOTIFICATION DOT */
  .notif-dot{position:relative;}
  .notif-dot::after{content:'';position:absolute;top:4px;right:4px;width:8px;height:8px;background:var(--danger);border-radius:50%;display:none;}
  .notif-dot.has-notif::after{display:block;}
  @media(max-width:768px){
    .sidebar{display:none;}
    .main{margin-left:0;}
    .stats-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sidebar-logo">🎫 <span>Support</span>Desk</div>
  <div class="sidebar-menu">
    <div class="sidebar-item active" onclick="filterByStatus('all',this)"><span class="sidebar-icon">📊</span>Dashboard</div>
    <div class="sidebar-item" onclick="filterByStatus('all',this)"><span class="sidebar-icon">🎫</span>All Tickets</div>
    <div class="sidebar-item" onclick="filterByStatus('Open',this)"><span class="sidebar-icon">🔴</span>Open</div>
    <div class="sidebar-item" onclick="filterByStatus('In Progress',this)"><span class="sidebar-icon">🟡</span>In Progress</div>
    <div class="sidebar-item" onclick="filterByStatus('Resolved',this)"><span class="sidebar-icon">🟢</span>Resolved</div>
  </div>
</nav>

<!-- MAIN -->
<div class="main">
  <!-- NAVBAR -->
  <div class="navbar">
    <div class="navbar-title">Support Ticket Dashboard</div>
    <div class="navbar-right">
      <button class="btn-icon notif-dot" id="notifBtn" title="Notifications">🔔</button>
      <button class="btn-icon" onclick="toggleDark()" title="Toggle Dark Mode">🌙</button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">
    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon">🎫</div><div><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total Tickets</div></div></div>
      <div class="stat-card"><div class="stat-icon">🔴</div><div><div class="stat-value" id="statOpen">0</div><div class="stat-label">Open</div></div></div>
      <div class="stat-card"><div class="stat-icon">🟡</div><div><div class="stat-value" id="statProgress">0</div><div class="stat-label">In Progress</div></div></div>
      <div class="stat-card"><div class="stat-icon">🟢</div><div><div class="stat-value" id="statResolved">0</div><div class="stat-label">Resolved</div></div></div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <input class="search-box" id="searchInput" placeholder="🔍 Search tickets..." oninput="renderTickets()"/>
      <select class="filter" id="filterPriority" onchange="renderTickets()">
        <option value="">All Priorities</option>
        <option value="High">🔴 High</option>
        <option value="Medium">🟡 Medium</option>
        <option value="Low">🟢 Low</option>
      </select>
      <select class="filter" id="filterStatus" onchange="renderTickets()">
        <option value="">All Statuses</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Resolved">Resolved</option>
      </select>
      <select class="filter" id="filterSort" onchange="renderTickets()">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="priority">Priority (High→Low)</option>
      </select>
      <button class="btn btn-outline" onclick="exportCSV()">📥 Export CSV</button>
    </div>

    <!-- TICKETS -->
    <div class="tickets-grid" id="ticketsGrid"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Ticket Details</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
let tickets = JSON.parse(localStorage.getItem('tickets') || '[]');
let activeFilter = 'all';
let currentModalId = null;

// Connect to SSE for live updates
const BASE_URL = window.location.origin;
const evtSource = new EventSource(`${BASE_URL}/events`);

evtSource.onmessage = (e) => {
  const data = JSON.parse(e.data);
  if (data.type === 'init') {
    if (data.tickets && data.tickets.length > 0) {
      tickets = data.tickets;
      saveTickets();
      renderTickets();
    }
  } else if (data.type === 'new_ticket') {
    tickets.unshift(data.ticket);
    saveTickets();
    renderTickets();
    showToast(`🎫 New ticket from ${data.ticket.sub_account_name}: ${data.ticket.task_name}`);
    document.getElementById('notifBtn').classList.add('has-notif');
  }
};

evtSource.onerror = () => {
  console.log('SSE disconnected, using localStorage data');
};

function saveTickets() {
  localStorage.setItem('tickets', JSON.stringify(tickets));
}

function getPriorityOrder(p) {
  return p === 'High' ? 1 : p === 'Medium' ? 2 : 3;
}

function getFilteredTickets() {
  let filtered = [...tickets];
  const search = document.getElementById('searchInput').value.toLowerCase();
  const priority = document.getElementById('filterPriority').value;
  const status = document.getElementById('filterStatus').value;
  const sort = document.getElementById('filterSort').value;

  if (activeFilter !== 'all') filtered = filtered.filter(t => t.status === activeFilter);
  if (search) filtered = filtered.filter(t =>
    t.task_name.toLowerCase().includes(search) ||
    t.sub_account_name.toLowerCase().includes(search) ||
    t.submitted_by.toLowerCase().includes(search) ||
    t.assign_to.toLowerCase().includes(search)
  );
  if (priority) filtered = filtered.filter(t => t.priority_level === priority);
  if (status) filtered = filtered.filter(t => t.status === status);
  if (sort === 'oldest') filtered.reverse();
  else if (sort === 'priority') filtered.sort((a,b) => getPriorityOrder(a.priority_level) - getPriorityOrder(b.priority_level));

  return filtered;
}

function renderTickets() {
  const filtered = getFilteredTickets();
  const grid = document.getElementById('ticketsGrid');
  updateStats();

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📭</div><div>No tickets found</div></div>`;
    return;
  }

  grid.innerHTML = filtered.map(t => `
    <div class="ticket-card" id="card-${t.id}">
      <div class="ticket-header">
        <span class="ticket-id">${t.id}</span>
        <span class="badge badge-${t.priority_level.toLowerCase()}">${t.priority_level}</span>
      </div>
      <div class="ticket-title">${escHtml(t.task_name)}</div>
      <div class="ticket-desc">${escHtml(t.task_description)}</div>
      <div class="ticket-meta">
        <div class="ticket-meta-item">👤 <strong>Submitted by:</strong> ${escHtml(t.submitted_by)}</div>
        <div class="ticket-meta-item">🏢 <strong>Sub Account:</strong> ${escHtml(t.sub_account_name)}</div>
        <div class="ticket-meta-item">🔧 <strong>Assigned to:</strong> ${escHtml(t.assign_to)}</div>
      </div>
      <div class="ticket-footer">
        <select class="status-select" onchange="updateStatus('${t.id}', this.value)">
          <option ${t.status==='Open'?'selected':''}>Open</option>
          <option ${t.status==='In Progress'?'selected':''}>In Progress</option>
          <option ${t.status==='Resolved'?'selected':''}>Resolved</option>
        </select>
        <button class="btn btn-sm btn-primary" onclick="viewDetail('${t.id}')">👁 View</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTicket('${t.id}')">🗑</button>
      </div>
      <div class="ticket-time">🕐 ${new Date(t.created_at).toLocaleString()}</div>
    </div>
  `).join('');
}

function updateStats() {
  document.getElementById('statTotal').textContent = tickets.length;
  document.getElementById('statOpen').textContent = tickets.filter(t=>t.status==='Open').length;
  document.getElementById('statProgress').textContent = tickets.filter(t=>t.status==='In Progress').length;
  document.getElementById('statResolved').textContent = tickets.filter(t=>t.status==='Resolved').length;
}

function updateStatus(id, status) {
  const t = tickets.find(t=>t.id===id);
  if (t) { t.status = status; saveTickets(); updateStats(); }
}

function deleteTicket(id) {
  if (!confirm('Delete this ticket?')) return;
  tickets = tickets.filter(t=>t.id!==id);
  saveTickets();
  renderTickets();
}

function viewDetail(id) {
  const t = tickets.find(t=>t.id===id);
  if (!t) return;
  currentModalId = id;
  const notes = JSON.parse(localStorage.getItem('notes')||'{}');
  document.getElementById('modalTitle').textContent = `${t.id} — ${t.task_name}`;
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-field"><div class="modal-label">Priority</div><div class="modal-value"><span class="badge badge-${t.priority_level.toLowerCase()}">${t.priority_level}</span></div></div>
    <div class="modal-field"><div class="modal-label">Status</div><div class="modal-value">${t.status}</div></div>
    <div class="modal-field"><div class="modal-label">Submitted By</div><div class="modal-value">${escHtml(t.submitted_by)}</div></div>
    <div class="modal-field"><div class="modal-label">Sub Account Name</div><div class="modal-value">${escHtml(t.sub_account_name)}</div></div>
    <div class="modal-field"><div class="modal-label">Assigned To</div><div class="modal-value">${escHtml(t.assign_to)}</div></div>
    <div class="modal-field"><div class="modal-label">Task Name</div><div class="modal-value">${escHtml(t.task_name)}</div></div>
    <div class="modal-field"><div class="modal-label">Task Description</div><div class="modal-value">${escHtml(t.task_description)}</div></div>
    <div class="modal-field"><div class="modal-label">Received</div><div class="modal-value">${new Date(t.created_at).toLocaleString()}</div></div>
    <div class="modal-field">
      <div class="modal-label">Internal Notes</div>
      <textarea class="notes-box" id="notesBox" placeholder="Add internal notes here...">${escHtml(notes[id]||'')}</textarea>
      <button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="saveNotes()">💾 Save Notes</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

function saveNotes() {
  const notes = JSON.parse(localStorage.getItem('notes')||'{}');
  notes[currentModalId] = document.getElementById('notesBox').value;
  localStorage.setItem('notes', JSON.stringify(notes));
  showToast('✅ Notes saved!');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function closeModalOnBg(e) { if (e.target.id==='modalOverlay') closeModal(); }

function filterByStatus(status, el) {
  activeFilter = status;
  document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('filterStatus').value = '';
  renderTickets();
}

function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode', document.body.classList.contains('dark'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 4000);
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function exportCSV() {
  const headers = ['Ticket ID','Submitted By','Sub Account','Assigned To','Task Name','Task Description','Priority','Status','Date Received'];
  const rows = tickets.map(t=>[t.id,t.submitted_by,t.sub_account_name,t.assign_to,t.task_name,t.task_description,t.priority_level,t.status,new Date(t.created_at).toLocaleString()].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','),...rows].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = `tickets-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// Init
if (localStorage.getItem('darkMode')==='true') document.body.classList.add('dark');
renderTickets();
</script>
</body>
</html>
