<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Support Ticket Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  /* Brand Palette */
  --deep-slate:#1A2B32;
  --off-white:#F8F9FA;
  --gold:#F28C06;
  --gold-soft:#E5A93C;
  --white:#FFFFFF;
  --charcoal:#2D3748;
  --muted-gray:#718096;

  /* Functional */
  --bg:var(--off-white);
  --sidebar-bg:var(--deep-slate);
  --card-bg:var(--white);
  --text:var(--charcoal);
  --subtext:var(--muted-gray);
  --border:#DDE1E7;
  --primary:var(--gold);
  --primary-light:#FFF3DC;
  --success:#10b981;
  --warning:var(--gold-soft);
  --danger:#ef4444;
  --sidebar-text:#8FAAB5;
  --sidebar-active:var(--white);
}
.dark{
  --bg:#0D1A1F;
  --card-bg:#1A2B32;
  --text:#E2E8F0;
  --subtext:#8FAAB5;
  --border:#243540;
  --primary-light:#2A3D47;
  --sidebar-bg:#0D1A1F;
}

body{font-family:'Open Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;transition:all 0.3s;}

/* ── SIDEBAR ── */
.sidebar{width:250px;background:var(--sidebar-bg);padding:0;display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100;box-shadow:4px 0 24px rgba(0,0,0,0.2);}

.sidebar-logo{
  padding:24px 20px;
  border-bottom:1px solid rgba(242,140,6,0.2);
  display:flex;align-items:center;justify-content:center;
}
.sidebar-logo img{
  width:180px;max-width:100%;height:auto;
  object-fit:contain;
  filter:drop-shadow(0 2px 8px rgba(242,140,6,0.25));
}
.sidebar-logo-text{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;color:var(--gold);letter-spacing:0.04em;line-height:1.2;text-transform:uppercase;}

.sidebar-section-label{
  padding:20px 20px 6px;
  font-family:'Montserrat',sans-serif;
  font-size:9px;font-weight:700;letter-spacing:0.12em;
  color:rgba(143,170,181,0.5);text-transform:uppercase;
}
.sidebar-menu{padding:8px 0;flex:1;}
.sidebar-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 20px;color:var(--sidebar-text);
  cursor:pointer;transition:all 0.2s;
  font-family:'Open Sans',sans-serif;font-size:13px;font-weight:500;
  border-left:3px solid transparent;
  margin:1px 0;
}
.sidebar-item:hover{background:rgba(242,140,6,0.08);color:var(--white);}
.sidebar-item.active{background:rgba(242,140,6,0.12);color:var(--white);border-left-color:var(--gold);}
.sidebar-icon{
  width:34px;height:34px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;
  background:rgba(255,255,255,0.05);
  transition:all 0.2s;
}
.sidebar-item.active .sidebar-icon,.sidebar-item:hover .sidebar-icon{
  background:rgba(242,140,6,0.2);
}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(242,140,6,0.15);}
.sidebar-user{display:flex;align-items:center;gap:10px;}
.sidebar-avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;font-family:'Montserrat',sans-serif;}
.sidebar-user-info{font-size:12px;color:var(--sidebar-text);}
.sidebar-user-name{font-weight:600;color:var(--white);font-size:13px;}

/* ── MAIN ── */
.main{margin-left:250px;flex:1;display:flex;flex-direction:column;min-height:100vh;}

.navbar{
  background:var(--card-bg);
  border-bottom:1px solid var(--border);
  padding:0 28px;height:66px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:99;
  box-shadow:0 2px 12px rgba(26,43,50,0.06);
}
.navbar-title{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:700;color:var(--text);letter-spacing:-0.01em;}
.navbar-subtitle{font-size:12px;color:var(--subtext);margin-top:1px;}
.navbar-right{display:flex;align-items:center;gap:12px;}
.btn-icon{
  background:none;border:1.5px solid var(--border);
  border-radius:10px;padding:8px 10px;cursor:pointer;
  font-size:16px;color:var(--text);transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;
}
.btn-icon:hover{background:var(--gold);color:#fff;border-color:var(--gold);transform:translateY(-1px);box-shadow:0 4px 12px rgba(242,140,6,0.3);}

/* ── CONTENT ── */
.content{padding:28px;flex:1;}

/* ── STAT CARDS ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:28px;}
.stat-card{
  background:var(--card-bg);border-radius:14px;padding:22px 20px;
  border:1px solid var(--border);
  display:flex;align-items:center;gap:16px;
  transition:all 0.25s;position:relative;overflow:hidden;
}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold-soft));
}
.stat-card:hover{box-shadow:0 8px 28px rgba(26,43,50,0.1);transform:translateY(-2px);}

/* 3D Icon wrappers */
.stat-icon{
  width:54px;height:54px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;flex-shrink:0;
  position:relative;
}
/* 3D effect via layered box shadows + pseudo */
.icon-total{
  background:linear-gradient(145deg,#fdf0d8,#f5d68a);
  box-shadow:0 6px 16px rgba(242,140,6,0.35),inset 0 1px 0 rgba(255,255,255,0.6),inset 0 -2px 0 rgba(200,100,0,0.25);
}
.icon-open{
  background:linear-gradient(145deg,#fde8e8,#f8b0b0);
  box-shadow:0 6px 16px rgba(239,68,68,0.3),inset 0 1px 0 rgba(255,255,255,0.6),inset 0 -2px 0 rgba(180,30,30,0.2);
}
.icon-progress{
  background:linear-gradient(145deg,#fef6d8,#f8d98a);
  box-shadow:0 6px 16px rgba(245,158,11,0.3),inset 0 1px 0 rgba(255,255,255,0.6),inset 0 -2px 0 rgba(160,100,0,0.2);
}
.icon-resolved{
  background:linear-gradient(145deg,#d8f8ed,#86e8c3);
  box-shadow:0 6px 16px rgba(16,185,129,0.3),inset 0 1px 0 rgba(255,255,255,0.6),inset 0 -2px 0 rgba(10,120,80,0.2);
}
.stat-value{font-family:'Montserrat',sans-serif;font-size:30px;font-weight:800;color:var(--deep-slate);letter-spacing:-0.02em;}
.dark .stat-value{color:var(--white);}
.stat-label{font-size:12px;color:var(--subtext);margin-top:2px;font-weight:500;}

/* ── TOOLBAR ── */
.toolbar{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
.search-box{
  flex:1;min-width:200px;padding:11px 16px;
  border:1.5px solid var(--border);border-radius:10px;
  background:var(--card-bg);color:var(--text);
  font-size:13px;outline:none;font-family:'Open Sans',sans-serif;
  transition:border-color 0.2s,box-shadow 0.2s;
}
.search-box:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,140,6,0.12);}
select.filter{
  padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;
  background:var(--card-bg);color:var(--text);font-size:13px;
  cursor:pointer;outline:none;font-family:'Open Sans',sans-serif;
  transition:border-color 0.2s;
}
select.filter:focus{border-color:var(--gold);}
.btn{padding:11px 18px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all 0.2s;font-family:'Open Sans',sans-serif;}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#fff;box-shadow:0 4px 14px rgba(242,140,6,0.35);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(242,140,6,0.45);}
.btn-outline{background:none;border:1.5px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}

/* ── TICKET CARDS ── */
.tickets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;}
.ticket-card{
  background:var(--card-bg);border-radius:14px;
  border:1px solid var(--border);padding:22px;
  transition:all 0.25s;position:relative;overflow:hidden;
}
.ticket-card::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0;transition:opacity 0.25s;
}
.ticket-card:hover{box-shadow:0 10px 32px rgba(26,43,50,0.12);transform:translateY(-3px);}
.ticket-card:hover::after{opacity:1;}
.ticket-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.ticket-id{font-size:11px;color:var(--subtext);font-weight:700;letter-spacing:0.06em;font-family:'Montserrat',sans-serif;text-transform:uppercase;}
.badge{padding:4px 12px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;font-family:'Montserrat',sans-serif;}
.badge-high{background:#fee2e2;color:#dc2626;}
.badge-medium{background:#fef3c7;color:#b45309;}
.badge-low{background:#d1fae5;color:#059669;}
.ticket-title{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;margin-bottom:8px;line-height:1.4;color:var(--text);}
.ticket-desc{font-size:13px;color:var(--subtext);margin-bottom:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ticket-meta{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border);}
.ticket-meta-item{font-size:12px;color:var(--subtext);display:flex;align-items:center;gap:6px;}
.ticket-meta-item strong{color:var(--text);font-weight:600;}
.meta-icon{font-size:14px;}
.ticket-footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.status-select{
  padding:6px 10px;border-radius:8px;
  border:1.5px solid var(--border);background:var(--card-bg);
  color:var(--text);font-size:12px;cursor:pointer;
  font-family:'Open Sans',sans-serif;font-weight:600;
}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:8px;}
.btn-view{
  background:linear-gradient(135deg,var(--gold),var(--gold-soft));
  color:#fff;border:none;
  box-shadow:0 3px 10px rgba(242,140,6,0.3);
}
.btn-view:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(242,140,6,0.4);}
.btn-danger{background:#fee2e2;color:#dc2626;border:none;}
.btn-danger:hover{background:#dc2626;color:#fff;}
.ticket-time{font-size:11px;color:var(--subtext);margin-top:12px;display:flex;align-items:center;gap:5px;}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,20,25,0.65);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--card-bg);border-radius:20px;padding:32px;
  width:90%;max-width:600px;max-height:90vh;overflow-y:auto;
  box-shadow:0 24px 64px rgba(0,0,0,0.25);
  border-top:4px solid var(--gold);
}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;}
.modal-title{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:800;color:var(--text);line-height:1.3;}
.modal-close{
  background:var(--bg);border:1.5px solid var(--border);
  width:34px;height:34px;border-radius:8px;
  font-size:16px;cursor:pointer;color:var(--subtext);
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.modal-close:hover{background:var(--danger);color:#fff;border-color:var(--danger);}
.modal-field{margin-bottom:18px;}
.modal-label{
  font-family:'Montserrat',sans-serif;
  font-size:10px;font-weight:700;color:var(--gold);
  text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px;
}
.modal-value{font-size:14px;color:var(--text);line-height:1.7;}
.notes-box{
  width:100%;padding:14px;border:1.5px solid var(--border);border-radius:10px;
  background:var(--bg);color:var(--text);font-size:13px;
  resize:vertical;min-height:100px;font-family:'Open Sans',sans-serif;
  transition:border-color 0.2s;
}
.notes-box:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,140,6,0.1);}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:28px;right:28px;
  background:var(--deep-slate);color:#fff;
  padding:14px 22px;border-radius:12px;font-size:13px;
  z-index:9999;display:none;
  animation:slideIn 0.3s ease;
  border-left:4px solid var(--gold);
  box-shadow:0 8px 24px rgba(0,0,0,0.25);
  font-family:'Open Sans',sans-serif;font-weight:500;
}
.toast.show{display:block;}
@keyframes slideIn{from{transform:translateX(110%);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:70px 20px;color:var(--subtext);}
.empty-icon{font-size:56px;margin-bottom:16px;filter:drop-shadow(0 6px 12px rgba(242,140,6,0.2));}
.empty-state p{font-family:'Montserrat',sans-serif;font-weight:600;font-size:15px;color:var(--muted-gray);}

/* ── NOTIF DOT ── */
.notif-wrap{position:relative;}
.notif-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;background:var(--danger);border-radius:50%;display:none;box-shadow:0 0 0 2px var(--card-bg);}
.notif-dot.show{display:block;}

/* ── SECTION HEADER ── */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.section-title{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:700;color:var(--text);}
.section-title span{color:var(--gold);}
.ticket-count-badge{
  background:linear-gradient(135deg,var(--gold),var(--gold-soft));
  color:#fff;padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:700;font-family:'Montserrat',sans-serif;
}

@media(max-width:768px){
  .sidebar{display:none;}
  .main{margin-left:0;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

    </div>
    <div class="navbar-right">
      <div class="notif-wrap">
        <button class="btn-icon" title="Notifications" onclick="clearNotif()">🔔</button>
        <div class="notif-dot" id="notifDot"></div>
      </div>
      <button class="btn-icon" onclick="toggleDark()" title="Toggle Dark Mode">🌙</button>
    </div>
  </div>

  <div class="content">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon icon-total">🎫</div>
        <div>
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">Total Tickets</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-open">🚨</div>
        <div>
          <div class="stat-value" id="statOpen">0</div>
          <div class="stat-label">Open</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-progress">⚙️</div>
        <div>
          <div class="stat-value" id="statProgress">0</div>
          <div class="stat-label">In Progress</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-resolved">✅</div>
        <div>
          <div class="stat-value" id="statResolved">0</div>
          <div class="stat-label">Resolved</div>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <input class="search-box" id="searchInput" placeholder="🔍  Search by task, account, name..." oninput="renderTickets()"/>
      <select class="filter" id="filterPriority" onchange="renderTickets()">
        <option value="">All Priorities</option>
        <option value="High">🔴 High</option>
        <option value="Medium">🟡 Medium</option>
        <option value="Low">🟢 Low</option>
      </select>
      <select class="filter" id="filterStatus" onchange="renderTickets()">
        <option value="">All Statuses</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Resolved">Resolved</option>
      </select>
      <select class="filter" id="filterSort" onchange="renderTickets()">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="priority">Priority (High→Low)</option>
      </select>
      <button class="btn btn-outline" onclick="exportCSV()">📥 Export CSV</button>
    </div>

    <div class="section-header">
      <div class="section-title">Active <span>Tickets</span></div>
      <div class="ticket-count-badge" id="ticketCountBadge">0 tickets</div>
    </div>

    <div class="tickets-grid" id="ticketsGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalBg(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Ticket Details</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var tickets = JSON.parse(localStorage.getItem('sd_tickets') || '[]');
var activeFilter = 'all';
var currentModalId = null;

// SSE live connection
var evtSource = new EventSource(window.location.origin + '/events');
evtSource.onmessage = function(e) {
  var data = JSON.parse(e.data);
  if (data.type === 'init' && data.tickets && data.tickets.length > 0) {
    tickets = data.tickets;
    save();
    renderTickets();
  } else if (data.type === 'new_ticket') {
    tickets.unshift(data.ticket);
    save();
    renderTickets();
    showToast('🎫 New ticket: ' + data.ticket.task_name + ' from ' + data.ticket.sub_account_name);
    document.getElementById('notifDot').classList.add('show');
  }
};
evtSource.onerror = function() { console.log('SSE: using cached data'); };

function save() { localStorage.setItem('sd_tickets', JSON.stringify(tickets)); }

function renderTickets() {
  var grid = document.getElementById('ticketsGrid');
  var search = document.getElementById('searchInput').value.toLowerCase();
  var priority = document.getElementById('filterPriority').value;
  var status = document.getElementById('filterStatus').value;
  var sort = document.getElementById('filterSort').value;
  var list = tickets.slice();

  if (activeFilter !== 'all') list = list.filter(function(t){ return t.status === activeFilter; });
  if (search) list = list.filter(function(t){
    return (t.task_name||'').toLowerCase().includes(search) ||
           (t.sub_account_name||'').toLowerCase().includes(search) ||
           (t.submitted_by||'').toLowerCase().includes(search) ||
           (t.assign_to||'').toLowerCase().includes(search);
  });
  if (priority) list = list.filter(function(t){ return t.priority_level === priority; });
  if (status) list = list.filter(function(t){ return t.status === status; });
  if (sort === 'oldest') list.reverse();
  else if (sort === 'priority') list.sort(function(a,b){ return prioOrder(a.priority_level)-prioOrder(b.priority_level); });

  updateStats();

  var badge = document.getElementById('ticketCountBadge');
  if (badge) badge.textContent = list.length + ' ticket' + (list.length !== 1 ? 's' : '');

  if (list.length === 0) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📭</div><p>No tickets found</p></div>';
    return;
  }

  // Status icon map
  var statusIcon = {'Open':'🔴','In Progress':'🟡','Resolved':'🟢'};

  grid.innerHTML = list.map(function(t) {
    var pl = (t.priority_level||'low').toLowerCase();
    return '<div class="ticket-card">' +
      '<div class="ticket-header"><span class="ticket-id">' + esc(t.id) + '</span><span class="badge badge-' + pl + '">' + esc(t.priority_level) + '</span></div>' +
      '<div class="ticket-title">' + esc(t.task_name) + '</div>' +
      '<div class="ticket-desc">' + esc(t.task_description) + '</div>' +
      '<div class="ticket-meta">' +
        '<div class="ticket-meta-item"><span class="meta-icon">👤</span><strong>Submitted by:</strong>&nbsp;' + esc(t.submitted_by) + '</div>' +
        '<div class="ticket-meta-item"><span class="meta-icon">🏢</span><strong>Sub Account:</strong>&nbsp;' + esc(t.sub_account_name) + '</div>' +
        '<div class="ticket-meta-item"><span class="meta-icon">🔧</span><strong>Assigned to:</strong>&nbsp;' + esc(t.assign_to) + '</div>' +
      '</div>' +
      '<div class="ticket-footer">' +
        '<select class="status-select" onchange="updateStatus(\'' + t.id + '\',this.value)">' +
          '<option' + (t.status==='Open'?' selected':'') + '>Open</option>' +
          '<option' + (t.status==='In Progress'?' selected':'') + '>In Progress</option>' +
          '<option' + (t.status==='Resolved'?' selected':'') + '>Resolved</option>' +
        '</select>' +
        '<button class="btn btn-view btn-sm" onclick="viewDetail(\'' + t.id + '\')">👁 View</button>' +
        '<button class="btn btn-danger btn-sm" onclick="delTicket(\'' + t.id + '\')">🗑</button>' +
      '</div>' +
      '<div class="ticket-time">🕐&nbsp;' + new Date(t.created_at).toLocaleString() + '</div>' +
    '</div>';
  }).join('');
}

function prioOrder(p){ return p==='High'?1:p==='Medium'?2:3; }

function updateStats() {
  document.getElementById('statTotal').textContent = tickets.length;
  document.getElementById('statOpen').textContent = tickets.filter(function(t){return t.status==='Open';}).length;
  document.getElementById('statProgress').textContent = tickets.filter(function(t){return t.status==='In Progress';}).length;
  document.getElementById('statResolved').textContent = tickets.filter(function(t){return t.status==='Resolved';}).length;
}

function updateStatus(id, status) {
  var t = tickets.find(function(t){return t.id===id;});
  if (t) { t.status = status; save(); updateStats(); }
}

function delTicket(id) {
  if (!confirm('Delete this ticket?')) return;
  tickets = tickets.filter(function(t){return t.id!==id;});
  save(); renderTickets();
}

function viewDetail(id) {
  var t = tickets.find(function(t){return t.id===id;});
  if (!t) return;
  currentModalId = id;
  var notes = JSON.parse(localStorage.getItem('sd_notes')||'{}');
  var pl = (t.priority_level||'low').toLowerCase();
  document.getElementById('modalTitle').textContent = t.id + ' — ' + t.task_name;
  document.getElementById('modalBody').innerHTML =
    '<div class="modal-field"><div class="modal-label">Priority</div><div class="modal-value"><span class="badge badge-' + pl + '">' + esc(t.priority_level) + '</span></div></div>' +
    '<div class="modal-field"><div class="modal-label">Status</div><div class="modal-value">' + esc(t.status) + '</div></div>' +
    '<div class="modal-field"><div class="modal-label">Submitted By</div><div class="modal-value">' + esc(t.submitted_by) + '</div></div>' +
    '<div class="modal-field"><div class="modal-label">Sub Account Name</div><div class="modal-value">' + esc(t.sub_account_name) + '</div></div>' +
    '<div class="modal-field"><div class="modal-label">Assigned To</div><div class="modal-value">' + esc(t.assign_to) + '</div></div>' +
    '<div class="modal-field"><div class="modal-label">Task Name</div><div class="modal-value">' + esc(t.task_name) + '</div></div>' +
    '<div class="modal-field"><div class="modal-label">Task Description</div><div class="modal-value">' + esc(t.task_description) + '</div></div>' +
    '<div class="modal-field"><div class="modal-label">Date Received</div><div class="modal-value">' + new Date(t.created_at).toLocaleString() + '</div></div>' +
    '<div class="modal-field"><div class="modal-label">Internal Notes</div>' +
    '<textarea class="notes-box" id="notesBox" placeholder="Add internal notes here...">' + esc(notes[id]||'') + '</textarea>' +
    '<button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="saveNotes()">💾 Save Notes</button></div>';
  document.getElementById('modalOverlay').classList.add('open');
}

function saveNotes() {
  var notes = JSON.parse(localStorage.getItem('sd_notes')||'{}');
  notes[currentModalId] = document.getElementById('notesBox').value;
  localStorage.setItem('sd_notes', JSON.stringify(notes));
  showToast('✅ Notes saved!');
}

function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
function closeModalBg(e){ if(e.target.id==='modalOverlay') closeModal(); }

function sidebarFilter(status, el) {
  activeFilter = status;
  document.querySelectorAll('.sidebar-item').forEach(function(i){i.classList.remove('active');});
  el.classList.add('active');
  document.getElementById('filterStatus').value = '';
  renderTickets();
}

function clearNotif(){ document.getElementById('notifDot').classList.remove('show'); }

function toggleDark(){
  document.body.classList.toggle('dark');
  localStorage.setItem('sd_dark', document.body.classList.contains('dark'));
}

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 4000);
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function exportCSV(){
  var headers = ['Ticket ID','Submitted By','Sub Account','Assigned To','Task Name','Task Description','Priority','Status','Date Received'];
  var rows = tickets.map(function(t){
    return [t.id,t.submitted_by,t.sub_account_name,t.assign_to,t.task_name,t.task_description,t.priority_level,t.status,new Date(t.created_at).toLocaleString()]
      .map(function(v){ return '"' + String(v||'').replace(/"/g,'""') + '"'; }).join(',');
  });
  var csv = [headers.join(',')].concat(rows).join('\n');
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'tickets-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

if(localStorage.getItem('sd_dark')==='true') document.body.classList.add('dark');
renderTickets();
</script>
</body>
</html>
